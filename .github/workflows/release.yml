name: Release

# Manual release: version from git tags, build, Developer ID sign, notarize, DMG, then (unless a dry
# run) the vX.Y.Z tag + GitHub Release and the Sparkle appcast. The steps live in
# build-and-publish.yml, shared with the nightly build. See docs/release.md for the one-time setup
# (the `release` environment and its secrets) and docs/release-spec.md for the rules.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Build, sign and notarize, but publish nothing (no tag, Release or appcast). The DMG is attached to the run.'
        type: boolean
        default: false
      runner:
        description: 'Runner override as JSON, e.g. "xcode-27" or ["self-hosted","macOS","ARM64"]. Empty uses the RUNNER_LABEL variable, then xcode-27.'
        required: false
        default: ''

# One build at a time (releases and nightlies share the group), never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write   # the called workflow tags, publishes and pushes gh-pages
    uses: ./.github/workflows/build-and-publish.yml
    # The shared build's job sets `environment: release` to read the signing material. A called
    # workflow only gets it when the caller also passes `secrets: inherit` (found by the first dry
    # run through the shared build: without it the certificate value arrived empty).
    secrets: inherit
    with:
      kind: release
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
      runner: ${{ inputs.runner }}
