name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override as JSON, e.g. "macos-27" or ["self-hosted","macOS"]. Empty uses the RUNNER_LABEL variable.'
        required: false
        default: ''
      run_ui_tests:
        description: 'Also run DeFeedbackHostUITests (needs a GUI session)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app-build-test:
    name: Build & unit tests
    runs-on: ${{ fromJSON(inputs.runner || vars.RUNNER_LABEL || '"macos-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/set-build-number.sh counts commits
      - name: Select Xcode
        if: ${{ vars.XCODE_PATH != '' }}
        run: sudo xcode-select -s "${{ vars.XCODE_PATH }}"
      - name: Toolchain info
        run: xcodebuild -version
      - name: Test
        run: |
          set -o pipefail
          ONLY="-only-testing:DeFeedbackHostTests"
          if [ "${{ inputs.run_ui_tests }}" = "true" ]; then ONLY=""; fi
          xcodebuild test \
            -project DeFeedbackHost.xcodeproj \
            -scheme DeFeedbackHost \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            $ONLY \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log

  swiftlint:
    name: SwiftLint
    runs-on: ${{ fromJSON(inputs.runner || vars.RUNNER_LABEL || '"macos-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --baseline .swiftlint.baseline.json --reporter github-actions-logging

  streamdeck:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('com.eklynx.sound.defeedback.sdPlugin/manifest.json','utf8'))"

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npx --yes @stoplight/spectral-cli@6 lint openapi.yaml

  ci-ok:
    name: ci-ok
    if: always()
    needs: [app-build-test, swiftlint, streamdeck, openapi-lint]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
