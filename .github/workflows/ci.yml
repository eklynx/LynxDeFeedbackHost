name: CI

# Builds the app unsigned and runs the unit tests on every pull request and every push to main.
# See docs/ci.md. Release, nightly and publishing workflows are separate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override as JSON, e.g. "xcode-27" or ["self-hosted","macOS"]. Empty uses the RUNNER_LABEL variable, then xcode-27.'
        required: false
        default: ''
      run_ui_tests:
        description: 'Also run DeFeedbackHostUITests (needs a GUI session and a signed build)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app-build-test:
    name: Build & unit tests
    # GitHub's hosted Xcode 27 image (macOS 27, Apple silicon). Switch to another runner, e.g. a
    # self-hosted Mac, with the RUNNER_LABEL repository variable; no workflow edit needed.
    runs-on: ${{ fromJSON(inputs.runner || vars.RUNNER_LABEL || '"xcode-27"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags and history, for the build number and version scripts
      - name: Select Xcode
        if: ${{ vars.XCODE_PATH != '' }}
        run: sudo xcode-select -s "${{ vars.XCODE_PATH }}"
      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers
      - name: Test
        env:
          RUN_UI_TESTS: ${{ inputs.run_ui_tests }}
        run: |
          set -o pipefail
          ONLY="-only-testing:DeFeedbackHostTests"
          if [ "$RUN_UI_TESTS" = "true" ]; then ONLY=""; fi
          xcodebuild test \
            -project DeFeedbackHost.xcodeproj \
            -scheme DeFeedbackHost \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            $ONLY \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log

  # Does the release's packaging work on the hosted runner? Archives the app the way a release does
  # and packs the DMG, but UNSIGNED and un-notarized (no certificate on pull requests). A failure
  # here would otherwise only show up in the middle of a real release.
  dmg-smoke:
    name: Archive and package a DMG
    runs-on: ${{ fromJSON(inputs.runner || vars.RUNNER_LABEL || '"xcode-27"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the Stream Deck plugin tools
        run: |
          npm install -g @elgato/cli
          cd streamdeck
          npm ci
          npm run build
      - name: Archive and package (unsigned)
        env:
          ALLOW_UNSIGNED_DMG: "YES"
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DeFeedbackHost.xcodeproj \
            -scheme DeFeedbackHost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/DeFeedbackHost.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/archive.log"
      - name: Check the image
        run: |
          DMG="$(ls build/*.dmg | head -n 1)"
          test -f "$DMG" || { echo "::error::no DMG was produced"; exit 1; }
          hdiutil verify "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" -quiet
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -d "$MOUNT"/*.app || { echo "::error::no app inside the DMG"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MOUNT"/*.app/Contents/Info.plist
      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log

  # Style check: any finding fails. SwiftLint is pinned to one release (checksum verified) so a new
  # SwiftLint can't turn CI red on its own. See docs/static-checks-spec.md (S1-S4).
  swiftlint:
    name: SwiftLint
    runs-on: ${{ fromJSON(inputs.runner || vars.RUNNER_LABEL || '"xcode-27"') }}
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # The one check to require in branch protection: it fails if any job above failed, was
  # cancelled or was skipped, so adding jobs later only means adding them to `needs`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [app-build-test, dmg-smoke, swiftlint]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
