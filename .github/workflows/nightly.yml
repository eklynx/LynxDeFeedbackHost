name: Nightly

# Every night (03:00 UTC), and by hand: if main has new commits since the last nightly or release,
# build, sign and notarize a nightly and publish it to the Nightly update channel (a GitHub
# pre-release plus an appcast item on the `nightly` channel), then keep only the newest 7 nightlies.
# The build itself is build-and-publish.yml, shared with the release. Rules: docs/nightly-spec.md.
# A failed scheduled run is reported by GitHub's own failed-run email.
on:
  schedule:
    - cron: "0 3 * * *"   # every day, 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if main has not changed since the last nightly or release'
        type: boolean
        default: false
      dry_run:
        description: 'Build, sign and notarize, but publish and prune nothing. The DMG is attached to the run.'
        type: boolean
        default: false
      keep:
        description: 'How many nightlies to keep'
        type: string
        default: "7"
      runner:
        description: 'Runner override as JSON, e.g. "xcode-27" or ["self-hosted","macOS","ARM64"]. Empty uses the RUNNER_LABEL variable, then xcode-27.'
        required: false
        default: ''

# One build at a time: nightlies and releases share the group (both push gh-pages).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    name: Has main changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Nightlies are built from main only (this run is on $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags tell what the last nightly and release were
      - name: Decide
        id: decision
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sh scripts/ci/should-build-nightly.sh --github-output | tee "$RUNNER_TEMP/decision.txt"
          { echo "### Nightly"; sed -n 's/^reason=/- /p;s/^build=/- build: /p' "$RUNNER_TEMP/decision.txt"; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the nightly
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    permissions:
      contents: write   # the called workflow tags, publishes and pushes gh-pages
    uses: ./.github/workflows/build-and-publish.yml
    # Without `secrets: inherit` the shared build's `environment: release` secrets arrive empty.
    secrets: inherit
    with:
      kind: nightly
      dry_run: ${{ inputs.dry_run || false }}
      runner: ${{ inputs.runner || '' }}

  prune:
    name: Keep only the newest nightlies
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: write   # the called workflow pushes gh-pages and deletes old releases and tags
    uses: ./.github/workflows/prune-builds.yml
    with:
      kind: nightly
      keep: ${{ inputs.keep || '7' }}
      dry_run: ${{ inputs.dry_run || false }}
