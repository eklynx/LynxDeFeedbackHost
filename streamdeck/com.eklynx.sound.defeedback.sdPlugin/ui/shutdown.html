<!DOCTYPE html>
<html>

<head lang="en">
    <title>Shutdown settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
<!--
    Hold this key, then tap the red key X times in a row without letting go. The phrase must match the app's
    shutdown phrase (Settings in the host app, shown on the web page).
-->
<sdpi-item label="Magic taps (X)">
    <sdpi-textfield setting="magicPresses" default="5" placeholder="5 (minimum)"></sdpi-textfield>
</sdpi-item>

<sdpi-heading>Shutdown phrase</sdpi-heading>
<sdpi-item label="Phrase">
    <sdpi-textfield global setting="shutdownPhrase" placeholder="Shutdown phrase goes here"></sdpi-textfield>
</sdpi-item>

<sdpi-heading>Plugin Settings</sdpi-heading>
<sdpi-item label="Host">
    <sdpi-textfield global setting="hostname" placeholder="localhost"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Port">
    <sdpi-textfield global setting="port" placeholder="8787"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Username">
    <sdpi-textfield global setting="username" placeholder="(optional)"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Password">
    <sdpi-textfield global setting="password" type="password" placeholder="(optional)"></sdpi-textfield>
</sdpi-item>
</body>

</html>
