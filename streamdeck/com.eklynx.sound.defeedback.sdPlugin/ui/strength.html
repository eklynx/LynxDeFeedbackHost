<!DOCTYPE html>
<html>

<head lang="en">
    <title>Bypass settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
<!--
    Learn more about property inspector components at https://sdpi-components.dev/docs/components
-->
<sdpi-item label="Instance Name">
    <sdpi-textfield setting="instanceName" default="Vox1" required=true ></sdpi-textfield>
</sdpi-item>
<sdpi-item id="strengthItem" label="Strength">
    <sdpi-textfield id="strengthField" setting="strengthPercent" pattern="([0-9][0-9]?|100)" default="80"></sdpi-textfield>
</sdpi-item>
<sdpi-item id="dialButtonItem" label="Dial Button" style="display:none">
    <sdpi-select id="dialButtonSelect" setting="dialButtonBehavior" default="none">
        <option value="none">None</option>
        <option value="mute">Mute</option>
        <option value="bypass">Bypass</option>
    </sdpi-select>
</sdpi-item>

<sdpi-heading>Plugin Settings</sdpi-heading>
<sdpi-item label="Host">
    <sdpi-textfield global setting="hostname" placeholder="localhost"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Port">
    <sdpi-textfield global setting="port" placeholder="8787"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Username">
    <sdpi-textfield global setting="username" placeholder="(optional)"></sdpi-textfield>
</sdpi-item>
<sdpi-item label="Password">
    <sdpi-textfield global setting="password" type="password" placeholder="(optional)"></sdpi-textfield>
</sdpi-item>
<script>
    SDPIComponents.streamDeckClient.getConnectionInfo().then((info) => {
        const isEncoder = info?.actionInfo?.payload?.controller === "Encoder";

        document.getElementById("strengthItem").style.display = isEncoder ? "none" : "";
        document.getElementById("dialButtonItem").style.display = isEncoder ? "" : "none";

        document.getElementById("strengthField").required = !isEncoder;
        document.getElementById("dialButtonSelect").required = isEncoder;
    });
</script>
</body>

</html>
