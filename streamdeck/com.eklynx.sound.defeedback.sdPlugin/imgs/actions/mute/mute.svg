<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">

	<symbol id="mute"  width="80" height="80"  viewBox="0 0 200 200">
		<g stroke="{color}" stroke-width="20">
			<path d="m21.186 21.186 157.63 157.63"/>
			<path d="m21.186 178.81 157.63-157.63"/>
			<rect x="34.111" y="64.01" width="33.796" height="71.981" fill="none"/>
			<path d="m67.908 64.01 72.756-48.539v169.06l-72.756-48.539z" fill="none"/>
		</g>
	</symbol>

	<symbol id="unmute"  width="80" height="80"  viewBox="0 0 200 200" >
		<g stroke="{color}" stroke-width="20">
			<rect x="34.111" y="64.01" width="33.796" height="71.981" fill="none"/>
			<path d="m67.908 64.01 72.756-48.539v169.06l-72.756-48.539z" fill="none"/>
			<path d="M164.51 79.42A32 32 0 0 1 164.51 120.58" fill="none" stroke-width="14" stroke-linecap="round"/>
			<path d="M179.83 66.56A52 52 0 0 1 179.83 133.44" fill="none" stroke-width="14" stroke-linecap="round"/>
		</g>
	</symbol>

	<symbol
			id="unknown"
			width="108"
			height="100"
			viewBox="0 0 40 37">
		<path fill="none" stroke="#F92" stroke-width="7"
			  d="m11,12a8.5,8 0 1,1 17,0q0,4-4,6t-4.5,4.5-.4,4v.2m0,3v7"/>
	</symbol>

	<symbol
			id="disconnected"
			width="108"
			height="108"
			viewBox="0 0 40 40"
			stroke="darkorange"
	>
		<!-- left cable + plug -->
		<line x1="2" y1="20" x2="8" y2="20" stroke-width="3"/>
		<rect x="8" y="14" width="8" height="12" rx="1.5" fill="darkorange" stroke="none"/>
		<line x1="16" y1="17" x2="19" y2="17" stroke-width="2"/>
		<line x1="16" y1="23" x2="19" y2="23" stroke-width="2"/>
		<!-- right socket + cable -->
		<rect x="24" y="14" width="8" height="12" rx="1.5" fill="darkorange" stroke="none"/>
		<line x1="32" y1="20" x2="38" y2="20" stroke-width="3"/>
		<!-- break marks -->
		<line x1="21.5" y1="7" x2="21.5" y2="10" stroke-width="2"/>
		<line x1="21.5" y1="30" x2="21.5" y2="33" stroke-width="2"/>
		<line x1="16" y1="9" x2="17.5" y2="11" stroke-width="2"/>
		<line x1="27" y1="9" x2="25.5" y2="11" stroke-width="2"/>
		<line x1="16" y1="31" x2="17.5" y2="29" stroke-width="2"/>
		<line x1="27" y1="31" x2="25.5" y2="29" stroke-width="2"/>
	</symbol>

	<symbol
			id="poweroff"
			width="90"
			height="95"
			stroke="darkorange"
			viewBox="-0.8 -0.5 177 202"
	>
		<path fill="none" stroke-width="30" stroke-linecap="round" d="M33.7,64.3C22.1,77.2,15,94.3,15,113
	c0,40.1,32.5,72.7,72.7,72.7c40.1,0,72.7-32.5,72.7-72.7c0-18.7-7.1-35.8-18.7-48.7"/>
		<line fill="none" stroke-width="30" stroke-linecap="round" x1="87.8" y1="15" x2="87.8" y2="113"/>
	</symbol>

	<rect x="0" y="0" width="144" height="144" stroke="none" fill="grey" stroke-width="0"/>
	<rect x="0" y="0" width="144" height="144" rx="25" ry="25"
		  stroke="{color}" fill="none" stroke-width="20" display="{showMuted}"/>

	<image x="0" y="0" width="144" height="144" href="data:image/png;base64," />


	<!-- Mute -->
	<g>
		<rect x="26" y="50" width="90" height="55" stroke="none" fill="grey" opacity="0.70" />
		<use href="#mute" x="34" y="35" display="{showMuted}"/>
		<use href="#unmute" x="34" y="35" display="{showUnmuted}"/>
		<use href="#unknown" x="19" y="18" display="{showUnknown}" />
		<use href="#disconnected" x="19" y="18" display="{showDisconnected}" />
		<use href="#poweroff" x="29" y="18" display="{showStopped}" />

		<text x="72" y="125" font-size="20pt" font-weight="900" stroke="black" fill="white"
			  text-anchor="middle" alignment-baseline="hanging" display="{showMuted}">muted</text>
		<text x="72" y="125" font-size="20pt" font-weight="900" stroke="black" fill="white"
			  text-anchor="middle" alignment-baseline="hanging" display="{showUnmuted}">unmuted</text>


	</g>
</svg>